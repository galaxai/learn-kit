<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One byte — demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../style/notes-light.css" id="theme-light" media="(prefers-color-scheme: light)" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/galaxai/learn-kit@main/style/notes-light.css'">
<link rel="stylesheet" href="../style/notes-dark.css"  id="theme-dark"  media="(prefers-color-scheme: dark)" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/galaxai/learn-kit@main/style/notes-dark.css'">
</head>
<body class="demo">

<form class="controls" onsubmit="return false">
  <label>Value <input type="range" id="value" min="0" max="255" step="1" value="72"></label>
  <output for="value" id="value-out">72</output>
  <button type="button" id="plus">+1</button>
</form>

<svg id="view" viewBox="0 0 640 150" role="img" aria-label="The eight bits of one byte and the number they make"></svg>

<script>
(function () {
  var l = document.getElementById('theme-light'), d = document.getElementById('theme-dark');
  function apply(t) {
    if (t === 'light')      { l.media = 'all';     d.media = 'not all'; }
    else if (t === 'dark')  { l.media = 'not all'; d.media = 'all'; }
    else { l.media = '(prefers-color-scheme: light)'; d.media = '(prefers-color-scheme: dark)'; }
  }
  try { apply(localStorage.getItem('notes-theme')); } catch (e) {}
  addEventListener('storage', function (e) { if (e.key === 'notes-theme') apply(e.newValue); });

  var input = document.getElementById('value');
  var params = new URLSearchParams(location.search);
  if (params.has('value')) input.value = params.get('value');
  input.addEventListener('input', draw);
  // +1 on 255 wraps to 0: a byte has no room for 256
  document.getElementById('plus').addEventListener('click', function () {
    input.value = (Number(input.value) + 1) % 256;
    draw();
  });

  var NS = 'http://www.w3.org/2000/svg', view = document.getElementById('view');
  function el(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return view.appendChild(n);
  }

  function draw() {
    var v = Number(input.value);
    document.getElementById('value-out').value = v;
    view.replaceChildren();
    for (var i = 0; i < 8; i++) {
      var weight = 128 >> i, on = (v & weight) !== 0, x = 24 + i * 74;
      el('rect', { 'class': on ? 'shape solid orange' : 'shape orange', x: x, y: 20, width: 60, height: 60 });
      el('text', { 'class': on ? 'label bold on-solid' : 'label', x: x + 30, y: 50 }, on ? '1' : '0');
      el('text', { 'class': 'label small', x: x + 30, y: 98 }, weight);
    }
    var sum = [];
    for (var j = 0; j < 8; j++) if (v & (128 >> j)) sum.push(128 >> j);
    el('text', { 'class': 'label mono', x: 320, y: 132 }, (sum.length ? sum.join(' + ') : '0') + ' = ' + v);
  }
  draw();
})();
</script>
</body>
</html>
